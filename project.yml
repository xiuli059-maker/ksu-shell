name: KSURoot
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  KSURoot:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - KSURoot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ksuroot
        PRODUCT_NAME: KSURoot
        INFOPLIST_FILE: KSURoot/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_STYLE: "Automatic"